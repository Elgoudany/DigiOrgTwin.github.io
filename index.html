<link rel="apple-touch-icon" href="icon.svg">
<title>Organisation OCP</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<style>
/* Layout : en-tête, onglets de familles, organigramme zoomable à gauche, fiche de l'entité à droite. */
:root{
  color-scheme: light dark;
  --paper:#F3F6F3; --surface:#FFFFFF; --ink:#15261D; --ink-soft:#57675F;
  --line:#D9E3DC; --line-strong:#BBD0C3;
  --g900:#0A4A32; --g700:#0E6B44; --g500:#1F9D57; --g300:#6FC396; --g100:#E4F1E9; --g050:#F0F7F2;
  --amber:#D99200; --amber-ink:#8A5E00; --amber-100:#FBEECB;
  --risk:#A8402B; --risk-ink:#8C3522; --risk-100:#F8E6E1;
  --shadow: 0 1px 0 rgba(21,38,29,.04), 0 10px 30px -22px rgba(10,74,50,.45);
  --font:"IBM Plex Sans",ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme: dark;
    --paper:#0D1510; --surface:#141F18; --ink:#E8F1EB; --ink-soft:#9BAEA3;
    --line:#243229; --line-strong:#32463A;
    --g900:#0C5C3C; --g700:#2E9E63; --g500:#33B072; --g300:#1C5E3F; --g100:#13301F; --g050:#10281A;
    --amber:#F0B829; --amber-ink:#F0B829; --amber-100:#2E2410;
    --risk:#E08A72; --risk-ink:#E08A72; --risk-100:#2E1A15;
    --shadow: 0 1px 0 rgba(0,0,0,.2), 0 14px 40px -24px rgba(0,0,0,.8);
  }
}
:root[data-theme="dark"]{
  color-scheme: dark;
  --paper:#0D1510; --surface:#141F18; --ink:#E8F1EB; --ink-soft:#9BAEA3;
  --line:#243229; --line-strong:#32463A;
  --g900:#0C5C3C; --g700:#2E9E63; --g500:#33B072; --g300:#1C5E3F; --g100:#13301F; --g050:#10281A;
  --amber:#F0B829; --amber-ink:#F0B829; --amber-100:#2E2410;
  --risk:#E08A72; --risk-ink:#E08A72; --risk-100:#2E1A15;
  --shadow: 0 1px 0 rgba(0,0,0,.2), 0 14px 40px -24px rgba(0,0,0,.8);
}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--font);font-size:14px;line-height:1.45;-webkit-font-smoothing:antialiased;}
button{font-family:inherit;}
.wrap{max-width:1200px;margin:0 auto;padding-block:22px 60px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));}
.onode:focus-visible,.oview:focus-visible,.oup:focus-visible,.ocrumb:focus-visible,.osc:focus-visible,textarea:focus-visible,input:focus-visible{outline:2px solid var(--g500);outline-offset:2px;}
header{display:flex;flex-wrap:wrap;gap:16px;align-items:center;justify-content:space-between;padding-bottom:16px;border-bottom:1px solid var(--line);}
.brand{display:flex;gap:13px;align-items:center;min-width:0;}
.logo{width:40px;height:40px;flex:none;border-radius:10px;background:var(--g700);display:grid;place-items:center;}
.logo svg{width:24px;height:24px;color:#fff}
h1{font-size:22px;line-height:1.1;font-weight:700;letter-spacing:-.02em;margin:0;}
.sub{font-size:13px;color:var(--ink-soft);margin:3px 0 0;}
.tag{display:inline-block;margin-left:8px;font-size:10.5px;font-weight:600;letter-spacing:.06em;color:var(--g700);background:var(--g100);border:1px solid var(--line-strong);padding:2px 7px;border-radius:5px;vertical-align:middle;transform:translateY(-2px);}
footer{margin-top:28px;font-size:11.5px;color:var(--ink-soft);line-height:1.55;border-top:1px solid var(--line);padding-top:14px;}
footer b{color:var(--ink);font-weight:600;}
.org-head{display:flex;gap:18px;align-items:flex-start;justify-content:space-between;flex-wrap:wrap;margin:18px 0 12px;}
.org-head h2{margin:0 0 4px;font-size:18px;}
.org-head .lead{margin:0;max-width:640px;font-size:13px;color:var(--ink-soft);line-height:1.5;}
.org-search{position:relative;min-width:260px;}
.org-search input{width:100%;font:inherit;font-size:13px;color:var(--ink);background:var(--surface);border:1px solid var(--line-strong);border-radius:10px;padding:9px 12px;}
.org-res{position:absolute;z-index:5;left:0;right:0;top:calc(100% + 4px);background:var(--surface);border:1px solid var(--line-strong);border-radius:10px;box-shadow:var(--shadow-lg);overflow:hidden;}
.org-res[hidden]{display:none;}
.org-res button{display:block;width:100%;text-align:left;background:none;border:0;border-bottom:1px solid var(--line);padding:8px 12px;font:inherit;font-size:12.5px;color:var(--ink);cursor:pointer;}
.org-res button:last-child{border-bottom:0;}
.org-res button:hover{background:var(--g050);}
.org-res small{display:block;color:var(--ink-soft);font-size:11px;margin-top:1px;}
.ores-none{padding:10px 12px;font-size:12.5px;color:var(--ink-soft);}
.org-grid{display:grid;grid-template-columns:minmax(0,1fr) 310px;gap:18px;align-items:start;}
.org-fiche{position:sticky;top:12px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;font-size:13px;}
.ofempty{color:var(--ink-soft);font-size:12.5px;line-height:1.5;}
.ofh{display:flex;gap:11px;align-items:center;}
.ofh h3{margin:0;font-size:15px;line-height:1.25;}
.ofh p{margin:2px 0 0;font-size:11.5px;color:var(--ink-soft);}
.opath{margin:12px 0 0;font-size:11.5px;color:var(--ink-soft);}
.ochips{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0 4px;}
.ochip{font-size:11px;font-weight:600;border-radius:6px;padding:2px 8px;background:var(--g050);color:var(--g700);border:1px solid var(--line);}
.ochip.ok{background:var(--g100);color:var(--g900);border-color:transparent;}
.ochip.warn{background:var(--amber-100);color:var(--amber-ink);border-color:transparent;}
.orow{display:flex;justify-content:space-between;gap:12px;padding:7px 0;border-bottom:1px solid var(--line);font-size:12.5px;}
.orow span{color:var(--ink-soft);flex:none;}
.orow b{font-weight:600;text-align:right;}
.orow i{font-weight:400;color:var(--ink-soft);}
.orem{margin:12px 0 0;font-size:12px;line-height:1.5;color:var(--ink-soft);}
.ocrumbs{display:flex;align-items:center;gap:4px;flex-wrap:wrap;margin:0 0 16px;min-height:32px;font-size:12.5px;}
.oup{background:var(--surface);border:1px solid var(--line-strong);border-radius:8px;padding:5px 10px;margin-right:8px;font:inherit;font-size:12px;font-weight:600;color:var(--g700);cursor:pointer;}
.oup:hover{border-color:var(--g500);}
.ocrumb{background:none;border:0;border-radius:7px;padding:4px 8px;font:inherit;color:var(--g700);font-weight:500;cursor:pointer;}
.ocrumb:hover{background:var(--g050);}
.osep{color:var(--ink-soft);}
.ocur{padding:4px 8px;font-weight:700;}
.orgstage{min-height:300px;}
.ostage{display:flex;flex-direction:column;align-items:center;transform-origin:50% 0;}
.ostage.zin{animation:ozin .45s cubic-bezier(.2,.8,.2,1) both;}
.ostage.zout{animation:ozout .45s cubic-bezier(.2,.8,.2,1) both;}
.ofocus{display:flex;justify-content:center;}
.ohint{margin:12px 0 0;font-size:12.5px;color:var(--ink-soft);}
.ostem{position:relative;width:2px;height:40px;background:var(--g500);transform-origin:top;animation:ostem .32s ease-out both;}
.ostem::after{content:"";position:absolute;left:50%;bottom:-8px;transform:translateX(-50%);border-left:7px solid transparent;border-right:7px solid transparent;border-top:9px solid var(--g500);opacity:0;animation:oarrow .2s .28s ease-out forwards;}
.opanel{width:100%;margin-top:6px;background:var(--g050);border:1px solid var(--g500);border-radius:16px;padding:16px;animation:opanel .4s .2s cubic-bezier(.2,.8,.2,1) both;}
.ogrp{margin:0 0 16px;}
.ogrp:last-child{margin-bottom:0;}
.ogl{margin:0 0 8px;font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-soft);display:flex;gap:8px;align-items:center;}
.ogl span{font-weight:500;letter-spacing:0;}
.ogl::after{content:"";flex:1;height:1px;background:var(--line-strong);}
.obr-h{margin:0 0 12px;font-size:12.5px;color:var(--ink-soft);display:flex;gap:8px;align-items:center;justify-content:center;}
.obr-h b{color:var(--ink);}
.obr-h span{font-size:11px;font-weight:700;background:var(--g100);color:var(--g900);border-radius:10px;padding:1px 8px;}
.okids{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;}
.onode{position:relative;display:flex;align-items:center;gap:10px;text-align:left;width:196px;background:var(--surface);color:var(--ink);border:1px solid var(--line-strong);border-radius:12px;padding:10px 12px;font:inherit;cursor:pointer;transition:transform .16s,border-color .16s,box-shadow .16s;}
.onode:hover{border-color:var(--g500);transform:translateY(-2px);box-shadow:var(--shadow);}
.onode:focus-visible{outline:2px solid var(--g500);outline-offset:2px;}
.onode .oic{flex:none;width:34px;height:34px;border-radius:10px;display:flex;align-items:center;justify-content:center;background:var(--g100);color:var(--g700);}
.onode .oic svg,.oic.big svg{width:19px;height:19px;}
.oic.big{flex:none;width:40px;height:40px;border-radius:11px;display:flex;align-items:center;justify-content:center;background:var(--g100);color:var(--g700);}
.otx{min-width:0;display:flex;flex-direction:column;gap:1px;}
.otx b{font-size:12.5px;font-weight:600;line-height:1.25;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;}
.otx small{font-size:11px;color:var(--ink-soft);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.ocnt{position:absolute;top:-8px;right:-8px;min-width:22px;height:22px;border-radius:11px;background:var(--g700);color:#fff;font-size:11.5px;font-weight:700;display:flex;align-items:center;justify-content:center;padding:0 6px;}
.onode.tbc{border-style:dashed;}
.onode.sel{border-color:var(--g500);box-shadow:0 0 0 2px var(--g500);}
.onode.focus{width:auto;min-width:270px;padding:13px 18px;border-color:var(--g700);box-shadow:var(--shadow);}
.onode.focus .oic{width:42px;height:42px;border-radius:12px;background:var(--g700);color:#fff;}
.onode.focus .oic svg{width:23px;height:23px;}
.onode.focus .otx b{font-size:14.5px;}
.onode.pulse{animation:opulse 1.9s ease-in-out infinite;}
.onode.kid{width:184px;padding:9px 11px;animation:orgIn .38s cubic-bezier(.2,.8,.2,1) both;animation-delay:calc(.28s + var(--i,0)*26ms);}
.onode.kid .oic{width:30px;height:30px;border-radius:9px;}
@keyframes ostem{from{transform:scaleY(0);}to{transform:scaleY(1);}}
@keyframes oarrow{from{opacity:0;}to{opacity:1;}}
@keyframes opanel{from{opacity:0;transform:translateY(-8px) scale(.98);}to{opacity:1;transform:none;}}
@keyframes orgIn{from{opacity:0;transform:translateY(10px) scale(.95);}to{opacity:1;transform:none;}}
@keyframes ozin{from{opacity:0;transform:scale(.88);}to{opacity:1;transform:none;}}
@keyframes ozout{from{opacity:0;transform:scale(1.1);}to{opacity:1;transform:none;}}
@keyframes opulse{0%,100%{box-shadow:0 0 0 0 rgba(31,157,87,.45);}50%{box-shadow:0 0 0 12px rgba(31,157,87,0);}}
@media (max-width:900px){.org-grid{grid-template-columns:1fr;}.org-fiche{position:static;}.onode.kid{width:calc(50% - 5px);}.onode.focus{min-width:0;width:100%;}}
@media (prefers-reduced-motion:reduce){.onode{transition:none;}.onode.kid,.onode.pulse,.ostage.zin,.ostage.zout,.ostem,.ostem::after,.opanel{animation:none;}.ostem::after{opacity:1;}}

.org-sumchips{flex-basis:100%;display:flex;flex-wrap:wrap;gap:6px;}
.onode.lit{border-color:var(--amber);box-shadow:0 0 0 2px var(--amber);}
.onode.lit.l3{background:var(--amber-100);}
.onode.trail{border-color:var(--amber);border-style:dashed;}
.onode.dim{filter:grayscale(.85) opacity(.5);}
.onode.lit.sel{box-shadow:0 0 0 2px var(--amber),0 0 0 5px var(--g500);}
.org-fiche{max-height:calc(100vh - 24px);overflow:auto;}

.oviews{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 14px;padding:4px;background:var(--g050);border:1px solid var(--line);border-radius:12px;width:fit-content;max-width:100%;}
.oview{display:inline-flex;align-items:center;gap:7px;background:none;border:0;border-radius:9px;padding:8px 14px;font:inherit;font-size:13px;font-weight:500;color:var(--ink-soft);cursor:pointer;transition:background .14s,color .14s;}
.oview:hover{color:var(--ink);}
.oview.on{background:var(--surface);color:var(--g700);font-weight:600;box-shadow:var(--shadow);}
.oview:focus-visible{outline:2px solid var(--g500);outline-offset:1px;}
.oview .n{font-size:11px;font-weight:700;color:var(--ink-soft);background:var(--g100);border-radius:9px;padding:0 7px;}
.oview.on .n{background:var(--g700);color:#fff;}
.ofh5{margin:14px 0 6px;font-size:11px;letter-spacing:.05em;text-transform:uppercase;color:var(--ink-soft);}
.omand{margin:0;font-size:12.5px;line-height:1.55;}
.omemd{margin-top:12px;font-size:12.5px;}
.omemd summary{cursor:pointer;font-weight:600;}
.omem{margin:8px 0 0;padding-left:18px;font-size:12px;color:var(--ink-soft);line-height:1.5;}
.omem i{font-style:normal;opacity:.8;}
.orow b .osc{vertical-align:middle;}

.org-fiche{max-height:calc(100vh - 24px);overflow:auto;}
.osc{max-width:190px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font:inherit;font-size:11.5px;font-weight:600;border-radius:14px;padding:3px 10px;cursor:pointer;border:1px solid var(--g500);background:var(--surface);color:var(--g700);}
.osc:hover{background:var(--g050);}
.osum{margin:12px 0 0;font-size:13px;line-height:1.55;}
.osum b{font-weight:600;}
.ofsec{margin:16px 0 0;}
.ofsec .ofh5{margin:0 0 6px;}
.org-main{min-width:0;}
@media (max-width:900px){.org-fiche{max-height:none;}}
</style>
</head>

const FAM_TXT={CM:'Instances de gouvernance du Groupe : mandat, présidence, fréquence et composition de chaque comité.',MI:'Missions transverses créées par note d’organisation : rattachement, responsable, sponsors et comité de pilotage.',TF:'Task forces et dispositifs temporaires : rattachement, responsable et mandat.'};
function orgRefresh(){
  ORG_ENT=ENTS.filter(e=>String(e.id).startsWith('OE-')).map(e=>({id:e.id,sigle:e.code,nom:e.nom,niv:e.niv,parent:e.par,type:e.cat,resp:e.resp,statut:e.statut,date:e.date,natureDate:e.natureDate,src:e.src,fiab:e.fiab,rem:e.rem}));
  const rank={strategique:0,tactique:1,operationnel:2};
  const cm=ENTS.filter(e=>String(e.id).startsWith('CM-')).slice().sort((a,b)=>(rank[norm(a.cniv)]??9)-(rank[norm(b.cniv)]??9));
  const dt=ENTS.filter(e=>String(e.id).startsWith('DT-')), mi=dt.filter(e=>norm(e.cat)==='mission'), tf=dt.filter(e=>norm(e.cat)!=='mission');
  const root=(id,nom,type,fam)=>({id,sigle:'',nom,niv:1,parent:'',type,resp:'',statut:'',date:'',natureDate:'',src:'',fiab:'',rem:'',fam,root:true});
  const node=(e,fam,sub)=>({...e,sigle:e.code,niv:2,parent:'FAM-'+fam,type:e.cat||'',fam,sub,att:e.par});
  const fams=[];
  if(cm.length){fams.push(root('FAM-CM','Comités','Comités','CM'));cm.forEach(e=>fams.push(node(e,'CM',[e.cniv,e.code].filter(Boolean).join(' · '))));}
  if(mi.length){fams.push(root('FAM-MI','Missions','Missions','MI'));mi.forEach(e=>fams.push(node(e,'MI',e.rat)));}
  if(tf.length){fams.push(root('FAM-TF','Task forces','Task forces','TF'));tf.forEach(e=>fams.push(node(e,'TF',e.rat)));}
  ORG_ALL=[...ORG_ENT,...fams];
  ORG_BY=new Map(ORG_ALL.map(e=>[e.id,e]));
  ORG_KIDS=new Map(); ORG_ALL.forEach(e=>{if(e.parent&&ORG_BY.has(e.parent)){if(!ORG_KIDS.has(e.parent))ORG_KIDS.set(e.parent,[]);ORG_KIDS.get(e.parent).push(e.id);}});
  const top=ORG_ENT.find(e=>e.niv===1)||ORG_ENT[0];
  if(top){orgS.focus=top.id;}
  const l=$('#orgLead'); if(l){const lv=new Set(ORG_ENT.map(e=>e.niv)).size;l.textContent=ORG_ENT.length+' entités sur '+lv+' niveaux, plus '+cm.length+' comités, '+mi.length+' missions et '+tf.length+' task forces. Cliquez OCP Group pour voir le niveau 2, puis une entité pour zoomer sur ses composantes. Les onglets donnent accès aux comités, missions et task forces. Chaque entité a sa fiche.';}
}

function summary(n){
  const p=ORG_BY.get(n.parent), kids=ORG_KIDS.get(n.id)||[];
  let s='<b>'+esc(n.nom)+'</b>'+(n.sigle?' ('+esc(n.sigle)+')':'')+' · '+esc(n.type||'Entité');
  if(n.niv&&!n.fam) s+=', niveau '+n.niv;
  if(p&&!p.root) s+='. Rattachement : '+esc(p.nom);
  else if(p&&p.root) s+='. Famille : '+esc(p.nom);
  s+='.';
  if(n.resp) s+=' Sous la responsabilité de '+esc(n.resp)+'.';
  if(kids.length&&!n.root) s+=' Compte '+kids.length+' composante'+(kids.length>1?'s':'')+' directe'+(kids.length>1?'s':'')+' : '+esc(names(kids,4))+'.';
  else if(!kids.length&&!n.root&&!n.fam) s+=' Aucune composante de niveau inférieur dans le référentiel.';
  return '<p class="osum">'+s+'</p>';
}
function orgFicheHTML(n){
  const ic='<span class="oic big">'+orgIcon(n.type)+'</span>';
  if(n.root){
    const kids=(ORG_KIDS.get(n.id)||[]).map(k=>ORG_BY.get(k)), c={};
    kids.forEach(k=>{const l=n.fam==='CM'?(k.cniv||'Autre'):(k.rat||'Non rattaché');c[l]=(c[l]||0)+1;});
    return '<div class="ofh">'+ic+'<div><h3>'+esc(n.nom)+'</h3><p>'+kids.length+' élément'+(kids.length>1?'s':'')+'</p></div></div>'
      +'<p class="osum">'+esc(FAM_TXT[n.fam]||'')+'</p><h5 class="ofh5" style="margin-top:16px">'+(n.fam==='CM'?'Par niveau':'Par rattachement')+'</h5>'
      +Object.entries(c).map(([l,x])=>row(esc(l),String(x))).join('');
  }
  const path=orgPath(n.id).map(p=>esc(p.sigle||p.nom)).join(' › ');
  const head='<div class="ofh">'+ic+'<div><h3>'+esc(n.nom)+'</h3><p>'+esc(n.sigle?n.sigle+' · ':'')+(n.fam?esc(n.type):'Niveau '+n.niv)+'</p></div></div><p class="opath">'+path+'</p>'

    body=(n.comp?'<div class="ofsec"><h5 class="ofh5">Compétence</h5><p class="omand">'+esc(n.comp)+'</p></div>':'')
      +'<div class="ofsec">'+row('Nature',esc(n.nat))+row('Scope',esc(n.rat)+(n.scd?' · '+esc(n.scd):''))+row('Présidence',esc(n.resp))+row('Secrétariat',esc(n.secr))+row('Fréquence',esc(n.freq))+row('Rôles membres',n.nbm!=null&&n.nbm!==''&&String(n.nbm)!=='0'?esc(String(n.nbm)):'')+dateRow(n)+row('Source',esc(n.src))+'</div>';
    const piloted=ORG_ALL.filter(e=>e.fam&&!e.root&&e.pil===n.id);

    const mem=Array.isArray(n.mem)?n.mem:[];
    if(mem.length) body+='<details class="omemd"><summary>Composition ('+mem.length+' rôle'+(mem.length>1?'s':'')+')</summary><ul class="omem">'+mem.map(m=>'<li>'+esc(m[0])+(m[1]?' <i>· '+esc(m[1])+'</i>':'')+'</li>').join('')+'</ul></details>';
  }else if(n.fam){
    body='<div class="ofsec">'+(n.att?row('Rattachement',orgGo(n.att)):'')+row('Responsable',esc(n.resp))+row('Sponsor',esc(n.sp1))+row('Sponsor (2)',esc(n.sp2))+(n.pil?row('Comité de pilotage',orgGo(n.pil)):'')+row('Échéance / durée',esc(n.ech))+dateRow(n)+row('Source',esc(n.src))+'</div>'
      +(n.mand?'<div class="ofsec"><h5 class="ofh5">Mandat</h5><p class="omand">'+esc(n.mand)+'</p></div>':'');
  }else{
    body='<div class="ofsec">'+row('Responsable',esc(n.resp))+row('Statut',esc(n.statut))+dateRow(n)+row('Source',esc(n.src))+'</div>'+kidsChips(n)+attached(n);

}
function orgViewsRender(){
  const box=$('#orgViews'); if(!box) return;
  const cur=orgPath(orgS.focus)[0], curId=cur?cur.id:'';
  box.innerHTML=ORG_ALL.filter(e=>e.niv===1).map(r=>{
    const n=r.root?(ORG_KIDS.get(r.id)||[]).length:ORG_ENT.length;
    return '<button type="button" class="oview'+(r.id===curId?' on':'')+'" data-view="'+esc(r.id)+'">'+esc(r.root?r.nom:'Organisation')+'<span class="n">'+n+'</span></button>';
  }).join('');
}
function orgRender(dir){
  const f=ORG_BY.get(orgS.focus), kids=(ORG_KIDS.get(f.id)||[]).map(k=>ORG_BY.get(k));
  const open=orgS.open&&kids.length>0;
  let h='<div class="ostage'+(dir?' z'+dir:'')+'"><div class="ofocus">'+orgCard(f,null,'focus'+(!open&&kids.length?' pulse':''))+'</div>';
  if(!open&&kids.length) h+='<p class="ohint">Cliquez pour déplier les '+kids.length+(f.fam?' éléments':' entités de niveau '+(f.niv+1))+'</p>';
  if(open){
    h+='<div class="ostem" aria-hidden="true"></div><div class="opanel">';
    if(f.niv===1&&f.fam==='CM'){
      let i=0; const known=['strategique','tactique','operationnel'];
      h+=['Stratégique','Tactique','Opérationnel'].map(lv=>{const items=kids.filter(n=>norm(n.cniv)===norm(lv));if(!items.length)return '';
        return '<div class="ogrp"><p class="ogl">Comités '+lv.toLowerCase()+'s<span>'+items.length+'</span></p><div class="okids">'+items.map(n=>orgCard(n,i++,'kid')).join('')+'</div></div>';}).join('');
      const rest=kids.filter(n=>!known.includes(norm(n.cniv)));
      if(rest.length) h+='<div class="ogrp"><p class="ogl">Autres<span>'+rest.length+'</span></p><div class="okids">'+rest.map(n=>orgCard(n,i++,'kid')).join('')+'</div></div>';
    }else if(f.niv===1&&!f.fam){
      let i=0;
      h+=['SBUs','Plateformes & pôles','Corporate & fonctions'].map(g=>{const items=kids.filter(n=>orgGroup(n)===g);if(!items.length)return '';
        return '<div class="ogrp"><p class="ogl">'+esc(g)+'<span>'+items.length+'</span></p><div class="okids">'+items.map(n=>orgCard(n,i++,'kid')).join('')+'</div></div>';}).join('');
    }else{
      h+='<div class="obr-h">'+(f.fam?'':'Composantes de ')+'<b>'+esc(f.nom)+'</b><span>'+kids.length+'</span></div><div class="okids">'+kids.map((k,i)=>orgCard(k,i,'kid')).join('')+'</div>';
    }
    h+='</div>';
  }
  h+='</div>';
  const st=$('#orgStage'); if(st) st.innerHTML=h;
  orgCrumbs(); orgViewsRender(); orgSelect(orgS.node||f.id);
}
function orgClick(id){
  const n=ORG_BY.get(id); if(!n)return;
  const kids=(ORG_KIDS.get(id)||[]).length;
  if(id===orgS.focus){ if(!orgS.open&&kids){orgS.open=true;orgS.node=id;orgRender('in');} else orgSelect(id); return; }
  if(kids){orgS.focus=id;orgS.open=true;orgS.node=id;orgRender('in');return;}
  orgSelect(id);
}
function orgNav(id){
  const prev=orgPath(orgS.focus).length, next=orgPath(id).length;
  orgS.focus=id;orgS.open=true;orgS.node=id;orgRender(next<prev?'out':'in');
}
function orgFocus(id){
  const n=ORG_BY.get(id); if(!n)return; const kids=(ORG_KIDS.get(id)||[]).length;
  orgS.focus=kids?id:(n.parent||id); orgS.open=true; orgS.node=id; orgRender('in');
}
function orgGoRoot(id){ if(!ORG_BY.has(id))return; orgS.focus=id; orgS.open=true; orgS.node=id; orgRender('in'); }
function buildOrg(){
  const root=$('#orgRoot');
  root.innerHTML='<div class="org-head"><div><p class="lead" id="orgLead"></p></div>'
    +'<div class="org-search"><input type="search" id="orgQ" placeholder="Rechercher une entité…" aria-label="Rechercher une entité" autocomplete="off"><div class="org-res" id="orgRes" hidden></div></div></div>'
    +'<div class="org-grid"><div class="org-main"><div class="oviews" id="orgViews"></div><div class="ocrumbs" id="orgCrumb"></div><div id="orgStage" class="orgstage"></div></div><aside class="org-fiche" id="orgFiche" aria-live="polite"></aside></div>';
  root.addEventListener('click',e=>{
    const g=e.target.closest&&e.target.closest('[data-go]'); if(g){const r=$('#orgRes');if(r)r.hidden=true;const q=$('#orgQ');if(q)q.value='';orgFocus(g.dataset.go);return;}
    const vw=e.target.closest&&e.target.closest('[data-view]'); if(vw){orgGoRoot(vw.dataset.view);return;}
    const nv=e.target.closest&&e.target.closest('[data-nav]'); if(nv){orgNav(nv.dataset.nav);return;}
    const b=e.target.closest&&e.target.closest('[data-n]'); if(b) orgClick(b.dataset.n);
  });
  $('#orgQ').addEventListener('input',()=>{
    const q=norm($('#orgQ').value), res=$('#orgRes');
    if(q.length<2){res.hidden=true;res.innerHTML='';return;}
    const hits=ORG_ALL.filter(e=>!e.root&&norm(e.nom+' '+e.sigle).includes(q)).slice(0,8);
    res.innerHTML=hits.length?hits.map(h=>'<button type="button" data-go="'+esc(h.id)+'"><b>'+esc(h.nom)+'</b><small>'+orgPath(h.id).slice(0,-1).map(p=>esc(p.sigle||p.nom)).join(' › ')+'</small></button>').join(''):'<div class="ores-none">Aucune entité trouvée.</div>';
    res.hidden=false;
  });
  orgRefresh();
}
buildOrg();
orgRender(null);
</script>

<script>if('serviceWorker' in navigator){window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));}</script>
</body>
</html>
